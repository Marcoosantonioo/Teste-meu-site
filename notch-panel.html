<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do notch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/notch.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
<main>
  <h1 class="sr">Painel do notch</h1>
  <div class="notch" id="notch" data-open="true">
    <button class="pill" id="pill" aria-expanded="false" aria-controls="panel" aria-label="Abrir painel de utilidades">
      <span class="art" aria-hidden="true"></span><span class="pt" id="pst" aria-hidden="true"></span><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>
    <div class="alertbar" id="alertbar" role="group" aria-label="Aviso de reunião" hidden><span class="al-t" id="alert-t"></span><span class="al-b"><a class="chip" id="alert-join" target="_blank" rel="noopener" hidden>Entrar</a><button class="chip" id="alert-x">Dispensar</button></span></div>
    <div class="wrap"><div class="panel" id="panel" role="region" aria-label="Painel de utilidades"><div class="inner">
      <div class="hdr"><div class="hclk"><span class="hbig" id="hclk" aria-hidden="true"></span><span class="hdt" id="hdate" aria-hidden="true"></span><span class="sr" id="hsr"></span></div><div class="hwx" id="hwx" aria-live="off"></div></div>
      <div class="tabs" role="tablist" aria-label="Utilidades" id="tabs"></div>
      <div id="view" role="tabpanel" tabindex="0"></div>
    </div></div></div>
  </div>
  <p class="hint sub">Clique no notch para abrir. Ctrl+Shift+Espaço abre e fecha, Esc fecha e as setas trocam de aba.</p>
  <div class="sr" role="status" aria-live="polite" id="live"></div>
</main>
<script src="js/notch.js"></script>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
