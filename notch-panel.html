<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do notch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e9eb;--txt:#3a3a3f;--ink:#fff;--mute:#a9a9b0;--row:#18181b;--line:#2c2c31;--orange:#ff9a2e;--green:#30d158;--blue:#5b8cff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d20;--txt:#c9c9cf}}
:root[data-theme="dark"]{--bg:#1d1d20;--txt:#c9c9cf}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--txt);font:400 15px/1.4 Barlow,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.notch{margin:0 auto;width:236px;background:#000;color:var(--ink);border-radius:0 0 26px 26px;box-shadow:0 18px 40px rgba(0,0,0,.28);transition:width .38s cubic-bezier(.3,1.2,.4,1);overflow:hidden}
.notch[data-open="true"]{width:min(600px,calc(100vw - 20px))}
.pill{display:flex;align-items:center;justify-content:space-between;width:100%;height:38px;padding:0 16px;transition:height .25s}
.notch[data-open="true"] .pill{height:24px;justify-content:center}
.notch[data-open="true"] .pill>*{display:none}
.notch[data-open="true"] .pill::after{content:"";width:40px;height:4px;border-radius:2px;background:#3a3a40}
.art{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#30d158,#0a6b2c)}
.bars{display:flex;gap:3px;align-items:center;height:18px}
.bars i{width:3px;height:100%;background:var(--ink);border-radius:2px;transform:scaleY(.3)}
.playing .bars i{animation:bar .9s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}.bars i:nth-child(4){animation-delay:.1s}
@keyframes bar{to{transform:scaleY(1)}}
.wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s ease}
.notch[data-open="true"] .wrap{grid-template-rows:1fr}
.panel{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s .38s}
.notch[data-open="true"] .panel{visibility:visible;transition-delay:0s}
.inner{padding:8px 20px 24px}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:16px}
.tab{display:flex;align-items:center;gap:8px;height:40px;padding:0 11px;border-radius:20px;color:var(--mute);font-weight:600;font-size:17px;white-space:nowrap}
.tab svg{width:20px;height:20px;flex:none}
.tab span{display:none}
.tab[aria-selected="true"]{background:#26262a;color:var(--ink)}
.tab[aria-selected="true"] span{display:inline}
.tab:hover{color:var(--ink)}
.sp{flex:1}
h2{margin:0 0 12px;font:700 30px/1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.sub{color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;background:var(--row);border-radius:14px;padding:11px 14px;margin-bottom:7px;position:relative;overflow:hidden;min-height:46px}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.tag{font-size:13px;color:var(--mute);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#2a2a2f;border-radius:16px;padding:5px 12px;font-weight:600;font-size:14px}
.chip:hover{background:#38383e}
.bar{position:absolute;left:0;top:0;bottom:0;background:rgba(91,140,255,.22);border-right:2px solid var(--blue)}
.dot{width:4px;height:20px;border-radius:2px;flex:none}
.ib{width:44px;height:44px;border-radius:50%;background:#2a2a2f;display:grid;place-items:center;flex:none}
.ib:hover{background:#3a3a40}
.ib svg{width:20px;height:20px}
.ib[aria-pressed="true"]{color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.ib.big{width:76px;border-radius:16px;height:52px;background:#333338}
.ib.sm{width:34px;height:34px;background:transparent}
/* música */
.now{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.now .art{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#3b4bff,#ff5a8a 60%,#ffb35a)}
.now b{display:block;font:700 34px/1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase}
.now span{font:600 30px/1.05 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;color:var(--mute)}
.prog{display:flex;align-items:center;gap:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-bottom:12px}
.track{flex:1;height:6px;border-radius:3px;background:#2c2c31;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);width:0}
.ctrl{display:flex;justify-content:center;gap:12px}
/* tarefas */
form.add{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;min-width:0;height:44px;border-radius:22px;border:0;background:var(--row);color:var(--ink);padding:0 16px;font:inherit}
input::placeholder{color:var(--mute)}
.add button{padding:0 16px;border-radius:22px;background:#2a2a2f;font-weight:600}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #6b6b72;flex:none;display:grid;place-items:center}
.chk[aria-checked="true"]{background:var(--green);border-color:var(--green);color:#000}
.chk svg{width:14px;height:14px}
.done .grow{text-decoration:line-through;color:var(--mute)}
/* clipboard */
.app{width:28px;height:28px;border-radius:7px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.acts{display:none;gap:4px}
.row:hover .acts,.row:focus-within .acts{display:flex}
.row:hover .tag.t,.row:focus-within .tag.t{display:none}
.blur{filter:blur(6px);user-select:none}
.copy{flex:1;text-align:left;min-width:0;overflow-wrap:anywhere}
/* pomodoro */
.pomo{border:3px solid #2c2c31;border-radius:22px;padding:14px 20px 18px}
.pomo .big{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.pomo .time{font:700 88px/1 Barlow,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pomo .mode{font:700 60px/1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;color:var(--orange)}
.pomo.rest .mode{color:var(--green)}
.pr{display:flex;align-items:center;gap:10px}
.pr .go{width:80px;height:52px;border-radius:16px;background:rgba(255,154,46,.25);color:var(--orange);display:grid;place-items:center}
.rest .go{background:rgba(48,209,88,.22);color:var(--green)}
.cyc{margin-left:auto;display:flex;gap:10px}
.cyc i{width:44px;height:44px;border-radius:50%;border:2px solid #7a7a82;display:grid;place-items:center;color:#000}
.cyc i.on{background:var(--orange);border-color:var(--orange)}
.sp-box{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.hint{text-align:center;margin:36px 16px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabs{overflow-x:auto;scrollbar-width:none;padding:4px;margin:-4px -4px 12px}
.fs{border:0;padding:0;margin:0 0 10px;display:flex;gap:8px;flex-wrap:wrap}.fs legend{padding:0;margin-bottom:8px;font-weight:600}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.fs .opt{background:var(--row);border-radius:22px;padding:0 16px}
input[type=radio],input[type=checkbox]{flex:none;width:22px;height:22px;padding:0;accent-color:var(--blue)}
select{width:100%;height:44px;border-radius:22px;border:0;background:var(--row);color:var(--ink);padding:0 16px;font:inherit;margin:4px 0 12px}
.tsel{margin-bottom:6px}
@media (max-width:520px){.tab{padding:0 9px}.pomo .time{font-size:60px}.pomo .mode{font-size:40px}.cyc i{width:32px;height:32px}.cyc{gap:6px}.now b{font-size:28px}.now span{font-size:24px}}
@media (hover:none){.acts{display:flex}.row .tag.t{display:none}.ib.sm{width:40px;height:40px}}
@media (forced-colors:active){
 .notch{border:1px solid CanvasText;border-top:0}
 .pill,.row,.ib,.chip,.tab,input,.add button,.pomo,.cyc i,.track,.chk{border:1px solid CanvasText}
 .tab[aria-selected="true"]{background:Highlight;color:HighlightText;border-width:3px}
 .ib[aria-pressed="true"]{border-width:3px}
 .chk[aria-checked="true"],.cyc i.on{background:Highlight;color:HighlightText}
 .track i,.bar{background:Highlight}
 .dot,.bars i,.pill::after{background:CanvasText}
 :focus-visible{outline:2px solid Highlight}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
option{background:#18181b;color:#fff}
select{color-scheme:dark}
.tk{flex-wrap:wrap}.tk .grow{min-width:120px}
.grip{color:#9a9aa2;cursor:grab;display:grid;place-items:center;width:16px;flex:none}.grip svg{width:16px;height:16px}
.acts2{display:flex;gap:2px;margin-left:auto}
.ef{flex:1;display:flex;gap:4px;align-items:center;min-width:0}
.ef input{height:38px;background:#000;border:2px solid #7a7a82;padding:0 12px}
.ib[aria-disabled="true"]{opacity:.35;cursor:default}
li.drag{opacity:.5}li.ins-b{box-shadow:0 -3px 0 #5b8cff}li.ins-a{box-shadow:0 3px 0 #5b8cff}
.rrow{display:flex;gap:8px;margin-bottom:8px}.rrow input{border:2px solid #7a7a82;height:40px}.rrow input:first-child{flex:0 0 34%}
.rvol{display:flex;gap:12px;align-items:center;margin-top:12px}
.rvol input[type=range]{height:24px;border:0;background:none;padding:0;accent-color:#30d158}
.pf{display:flex;gap:10px;align-items:flex-end;margin-top:12px;flex-wrap:wrap}
.pfr{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}.pfr label{color:#a9a9b0;font-size:14px}
.pf input{height:40px;border:2px solid #7a7a82}
.err{color:#ff8a80;margin:6px 2px 0}
.acts2{align-items:center}
.mvs{display:flex;flex-direction:column}
.mvs .ib.sm{width:34px;height:24px;border-radius:0;background:#2a2a2f}
.mvs .ib.sm:first-child{border-radius:8px 8px 0 0}.mvs .ib.sm:last-child{border-radius:0 0 8px 8px}
.mvs .ib.sm svg{width:16px;height:16px}
.tk{padding-top:6px;padding-bottom:6px}
.redact{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}.rrow .ib.sm{flex:none}
.now .like{margin-left:auto;flex:none}.now .like svg{width:24px;height:24px}
.like[aria-pressed="true"]{color:#30d158}
.now div{overflow-wrap:anywhere}
.prog input.seek{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:6px;padding:0;border:0;border-radius:3px;background:linear-gradient(to right,#fff var(--p,0%),#6a6a74 var(--p,0%));cursor:pointer}
.prog input.seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:0;margin-top:0}
.prog input.seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.prog input.seek::-moz-range-track{background:transparent}
@media (max-width:420px){.pomo .big{flex-wrap:wrap;column-gap:12px}.pomo .time{font-size:56px}.pomo .mode{font-size:34px}.pr{flex-wrap:wrap}.cyc{margin-left:0;width:100%;justify-content:flex-end}}
.notch input:not([type=range]):not([type=checkbox]):not([type=radio]),.notch select{border:2px solid #7a7a82}
.hint.sub{color:var(--txt)}
code{overflow-wrap:anywhere;color:#fff;background:#18181b;padding:2px 6px;border-radius:6px}
html.app,html.app body{background:transparent!important}
html.app .hint{display:none}html.app .notch{box-shadow:none}
html.app .panel .inner{max-height:calc(100vh - 40px);overflow-y:auto}
.dt{margin-top:10px}.dt summary{cursor:pointer;padding:8px 0;color:#fff;font-weight:600}
.dt .row{margin-top:6px}
select#sdev,select#rsleep{flex:1;max-width:60%}
.calnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.calnav .ib{width:40px;height:40px}
.calnav input[type=date]{flex:none;width:auto;height:40px;padding:0 12px;border-radius:20px;color-scheme:dark}
.cbz{display:inline-flex;align-items:center;gap:8px;color:#fff;margin-left:2px}
.chip[aria-pressed="true"]{background:#fff;color:#000}
.dh{font:700 20px/1.1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;margin:14px 0 6px;color:#fff}
a.chip{color:inherit;text-decoration:none}
.calnav input[type=date]:focus-visible,input[type=date]:focus-visible{outline:2px solid #5b8cff;outline-offset:2px}
input[type=date]:focus-within{outline:2px solid #5b8cff;outline-offset:2px}
.pt{flex:1;min-width:0;padding:0 10px;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.notch.has-st:not([data-open="true"]){width:min(340px,calc(100vw - 20px))}
.alertbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:4px 16px 12px;font-size:14px}
.alertbar[hidden]{display:none}.al-t{flex:1;min-width:140px;overflow-wrap:anywhere;font-weight:600}.al-b{display:inline-flex;gap:8px}
.alertbar .chip[hidden]{display:none}
.due.late{color:#ff8a80;font-weight:600}
form.add{flex-wrap:wrap}form.add #nt{flex:1 1 160px}
form.add input[type=date],.ef input[type=date]{flex:none;width:auto;height:44px;padding:0 12px;border-radius:22px;color-scheme:dark}
.ef{flex-wrap:wrap}.ef input[type=date]{height:38px}
label.opt span{flex:1 1 auto;min-width:0}
@media (min-width:421px){label.opt span{white-space:nowrap}}
label.opt select#oalert{width:auto;flex:0 1 auto;margin:0;min-width:0;max-width:50%}
.hdr{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.hclk{flex:1 1 200px;background:var(--row);border-radius:18px;padding:12px 16px;min-width:0}
.hbig{display:block;font:700 44px/1 "Barlow Condensed",Impact,sans-serif;font-variant-numeric:tabular-nums;color:#fff}
.hdt{display:block;color:var(--mute);font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.hwx{flex:2 1 260px;background:var(--row);border-radius:18px;padding:10px 14px;min-width:0;font-size:14px}
.wnow{display:flex;align-items:center;gap:10px}
.wicon{color:#ffd166;display:flex}
.wt{font:700 40px/1 "Barlow Condensed",Impact,sans-serif;font-variant-numeric:tabular-nums}
.wd{display:flex;flex-direction:column;min-width:0}
.wcity{font-weight:600;overflow-wrap:anywhere}
.wdays{display:flex;gap:8px;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.fd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-variant-numeric:tabular-nums}
.fd svg{color:#ffd166}
</style>
</head>
<body>
<main>
  <h1 class="sr">Painel do notch</h1>
  <div class="notch" id="notch" data-open="false">
    <button class="pill" id="pill" aria-expanded="false" aria-controls="panel" aria-label="Abrir painel de utilidades">
      <span class="art" aria-hidden="true"></span><span class="pt" id="pst" aria-hidden="true"></span><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>
    <div class="alertbar" id="alertbar" role="group" aria-label="Aviso de reunião" hidden><span class="al-t" id="alert-t"></span><span class="al-b"><a class="chip" id="alert-join" target="_blank" rel="noopener" hidden>Entrar</a><button class="chip" id="alert-x">Dispensar</button></span></div>
    <div class="wrap"><div class="panel" id="panel" role="region" aria-label="Painel de utilidades"><div class="inner">
      <div class="hdr"><div class="hclk"><span class="hbig" id="hclk" aria-hidden="true"></span><span class="hdt" id="hdate" aria-hidden="true"></span><span class="sr" id="hsr"></span></div><div class="hwx" id="hwx" aria-live="off"></div></div>
      <div class="tabs" role="tablist" aria-label="Utilidades" id="tabs"></div>
      <div id="view" role="tabpanel" tabindex="0"></div>
    </div></div></div>
  </div>
  <p class="hint sub">Clique no notch para abrir. Ctrl+Shift+Espaço abre e fecha, Esc fecha e as setas trocam de aba.</p>
  <div class="sr" role="status" aria-live="polite" id="live"></div>
</main>

const TABS=[['cal','Agenda','cal'],['tasks','Tarefas','check'],['clip','Copiados','clip'],['pomo','Pomodoro','timer'],['set','Ajustes','sl'],['radio','Rádio','radio'],['music','Música','music']];
const S={open:false,tab:'music',

function applyTheme(){const t=ls.get('theme'),r=document.documentElement;if(t==='light'||t==='dark')r.dataset.theme=t;else r.removeAttribute('data-theme')}

function ac(){return S.ac||(S.ac=new (window.AudioContext||window.webkitAudioContext)())}
function beep(){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.7);o.start();o.stop(c.currentTime+.7)}catch(_){}}
document.addEventListener('click',()=>{if(ls.get('opt_snd')==='1'){try{const c=ac();if(c.state==='suspended')c.resume()}catch(_){}}});
function alarm(){const msg=pmsg(S.p.mode);

 if(t.id==='ptask'){S.p.task=t.value;return}
 if(t.name==='th'){ls.set('theme',t.value);applyTheme()}
 if(t.id==='osnd'){ls.set('opt_snd',t.checked?'1':'0');if(t.checked)beep()}
 if(t.id==='ontf'){
  if(!t.checked){ls.set('opt_ntf','0');return}
  if(!window.Notification){t.checked=false;say('Este navegador não oferece notificações');return}

async function mAuth(want){ls.set('ms_want',JSON.stringify(want||{}));
 const v=b64(crypto.getRandomValues(new Uint8Array(48))),st='ms.'+b64(crypto.getRandomValues(new Uint8Array(12)));
 ls.set('ms_v',v);ls.set('ms_st',st);
 const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 location.href=MS_AUTH+'/authorize?'+new URLSearchParams({client_id:MS_CLIENT_ID,response_type:'code',redirect_uri:MS_REDIRECT,response_mode:'query',scope:msScopes(),state:st,code_challenge:ch,code_challenge_method:'S256'})}
async function msToken(body){
 const r=await fetch(MS_AUTH+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:MS_CLIENT_ID,scope:msScopes(),...body})});
 if(!r.ok){const e=new Error('token');e.status=r.status;throw e}
 const j=await r.json();S.ms=j.access_token;S.msExp=Date.now()+(j.expires_in-120)*1000;if(j.refresh_token)ls.set('ms_rt',j.refresh_token)}
function mapEv(e,td,mp){const n=new Date(),p=x=>new Date(x.dateTime.split('.')[0]+'Z'),ad=e.isAllDay,s=!ad&&p(e.start),f=!ad&&p(e.end);
 let u=(e.onlineMeeting&&e.onlineMeeting.joinUrl)||'';if(!/^https:/.test(u))u='';
 const lb=!u?'':e.onlineMeetingProvider==='teamsForBusiness'||/teams\.(microsoft|live)\.com/.test(u)?'Teams':/zoom/.test(u)?'Zoom':'Entrar';
 let tag='dia todo',pr=0;
 if(s&&td===false)tag=s.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' – '+f.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 else if(s){const m=Math.round((s-n)/6e4);
  if(n>=s&&n<f){tag='faltam '+Math.ceil((f-n)/6e4)+' min';pr=Math.round((n-s)/(f-s)*100)}
  else if(m>0&&m<360)tag='em '+(m>=60?Math.floor(m/60)+'h ':'')+(m%60?m%60+'min':'');
  else tag=s.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
 if(mp&&s){pr=0;tag=mp.i===0?s.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' →':mp.i===mp.n-1?'até '+f.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'dia todo'}else if(mp)tag='dia '+(mp.i+1)+' de '+mp.n;
 return [s?'#5b8cff':'#3ecf8e',esc(e.subject||'(sem título)'),lb,tag.trim(),pr,esc(u)]}
async function msSync(manual){if(!msOn())return;
 if(!S.ms||Date.now()>S.msExp){
  try{await msToken({grant_type:'refresh_token',refresh_token:ls.get('ms_rt')||''})}
  catch(e){if(e.status===400||e.status===401){ls.del('ms_rt');S.ms=null;S.ev=null;say('Sessão da Microsoft expirada. Conecte de novo')}else say('Não foi possível ler a agenda');S.msLoad=false;if(S.tab==='cal'&&S.open)view();return}}
 const key=calKey(),days=S.cm==='next'?nextDays():[cd()],a=new Date(days[0]),b=new Date(days[days.length-1]);b.setDate(b.getDate()+1);
 try{const r=await fetch('https://graph.microsoft.com/v1.0/me/calendarView?'+new URLSearchParams({startDateTime:a.toISOString(),endDateTime:b.toISOString(),'$orderby':'start/dateTime','$top':String(days.length>1?100:25),'$select':'subject,start,end,isAllDay,isCancelled,onlineMeeting,onlineMeetingProvider'}),{headers:{Authorization:'Bearer '+S.ms,Prefer:'outlook.timezone="UTC"'}});
  if(r.status===401){S.ms=null;S.msExp=0}
  else if(r.ok){const js=(await r.json()).value.filter(e=>!e.isCancelled);if(days.some(d=>isToday(d)))S.td=pillEv(js);else msToday();if(key!==calKey())return;
  S.evg=days.map(d=>({k:dayKey(d),d,rows:[]}));
  js.forEach(e=>{const ks=evDays(e);ks.forEach((k,i)=>{const g=S.evg.find(x=>x.k===k);if(g)g.rows.push(mapEv(e,isToday(g.d),ks.length>1?{i,n:ks.length}:null))})});
  S.ev=S.evg.flatMap(g=>g.rows);S.evk=key;S.msAt=Date.now()}else say('Não foi possível ler a agenda')}catch(_){say('Não foi possível ler a agenda')}
 S.msLoad=false;if(S.tab==='cal'&&S.open)keepFocus(view);
 if(manual)say(S.msAt&&Date.now()-S.msAt<5000?'Agenda atualizada às '+hm(S.msAt):'Não foi possível atualizar a agenda agora')}
(async()=>{const u=new URLSearchParams(location.search),c=u.get('code'),st=u.get('state')||'';
 if(MS_CLIENT_ID&&st.startsWith('ms.')&&(c||u.get('error'))){
  if(c&&st===ls.get('ms_st')){try{await msToken({grant_type:'authorization_code',code:c,redirect_uri:MS_REDIRECT,code_verifier:ls.get('ms_v')||''});msPromote();say('Microsoft conectada')}catch(_){say('Falha ao conectar à Microsoft')}}
  else say('Não foi possível concluir o login da Microsoft');
  ls.del('ms_st');ls.del('ms_v');const wt=(ls.get('ms_want')||'{}')!=='{}'?'set':'cal';ls.del('ms_want');history.replaceState(null,'',location.pathname);S.tab=wt;setOpen(true)}
 if(msOn()){S.ev=S.ev||[];S.msLoad=true;if(S.tab==='cal'&&S.open)view();await msSync();todoSync();drvStart()}})();

function taskView(){const T=S.tasks,n=T.length;
 return (S.undo?`<div class="row" style="justify-content:space-between"><span>Tarefa removida.</span><button class="chip" data-a="tundo">Desfazer</button></div>`:'')+`${todoBar()}<form class="add" id="addf"><input id="nt" aria-label="Nova tarefa" placeholder="Nova tarefa" autocomplete="off"><input type="date" id="ntd" aria-label="Vencimento (opcional)"><button>Adicionar</button></form><ul style="list-style:none;padding:0;margin:0">`+T.map((t,i)=>{const ed=S.edit===t.id,lab=t.t;
  return `<li class="row tk${t.d?' done':''}" data-r="${i}"${ed?'':' draggable="true"'}><span class="grip" aria-hidden="true">${ic('grip')}</span><button class="chk" role="checkbox" aria-checked="${t.d}" aria-label="${lab}" data-i="${i}">${t.d?ic('check'):''}</button>`+
  (ed?`<form class="ef" data-r="${i}"><input id="ted" aria-label="Editar tarefa" value="${lab}" autocomplete="off"><input type="date" id="ted-d" aria-label="Vencimento da tarefa" value="${t.due||''}"><button class="ib sm" aria-label="Salvar edição">${ic('check')}</button><button type="button" class="ib sm" data-a="tcan" data-i="${i}" aria-label="Cancelar edição">${ic('x')}</button></form>`
  :`<span class="grow">${lab}</span><span class="tag">${dueTag(t)}${t.c?t.c+(t.c>1?' ciclos':' ciclo'):t.w}</span><span class="acts2"><button class="ib sm" data-a="ted" data-i="${i}" aria-label="Editar: ${lab}">${ic('edit')}</button><span class="mvs"><button class="ib sm" data-a="tup" data-i="${i}" aria-disabled="${i===0}" aria-label="Mover para cima: ${lab}">${ic('tup')}</button><button class="ib sm" data-a="tdn" data-i="${i}" aria-disabled="${i===n-1}" aria-label="Mover para baixo: ${lab}">${ic('tdn')}</button></span><button class="ib sm" data-a="tdel" data-i="${i}" aria-label="Remover: ${lab}">${ic('x')}</button></span>`)+'</li>'}).join('')+'</ul>'+(T.some(x=>x.due)?'<button class="chip" data-a="tsort" style="margin-top:8px">Ordenar por vencimento</button>':'')+
  (n?'<p class="sub" style="margin:8px 2px 0">Arraste pelo ícone à esquerda ou use os botões de subir e descer.</p>':'<p class="sub">Nenhuma tarefa. Adicione a primeira acima.</p>')}
function endEdit(i){S.edit=null;view();const b=$('#view [data-a="ted"][data-i="'+i+'"]');if(b)b.focus()}
function taskAct(a,i){const T=S.tasks;
 if(a==='tsort'){const key=t=>t.d?2:t.due?0:1;const ord=T.map((t,k)=>({t,k})).sort((x,y)=>key(x.t)-key(y.t)||(key(x.t)===0?(x.t.due<y.t.due?-1:x.t.due>y.t.due?1:0):0)||x.k-y.k).map(o=>o.t);
  S.tasks=ord;save();view();const b=$('#view [data-a="tsort"]');if(b)b.focus();say('Tarefas ordenadas por vencimento');return true}
 if(a==='ted'){S.edit=T[i].id;view();const n=$('#ted');n.focus();n.select();return true}
 if(a==='tcan'){endEdit(i);return true}
 if(a==='tup'||a==='tdn'){const j=a==='tup'?i-1:i+1;if(j<0||j>=T.length)return true;
  [T[i],T[j]]=[T[j],T[i]];save();view();const b=$('#view [data-a="'+a+'"][data-i="'+j+'"]');if(b)b.focus();say(unesc(T[j].t)+': posição '+(j+1)+' de '+T.length);return true}
 if(a==='tdel'){const t=T.splice(i,1)[0];if(String(S.p.task)===String(t.id))S.p.task='';todoQueueDel(t);S.undo={t,i};save();view();const b=$('#view [data-a="tundo"]');if(b)b.focus();say('Tarefa removida. O botão Desfazer está no topo da lista');return true}
 if(a==='tundo'&&S.undo){const u=S.undo;S.undo=null;const k=Math.min(u.i,T.length);T.splice(k,0,u.t);todoUnqueue(u.t);save();view();const b=$('#view [data-a="ted"][data-i="'+k+'"]')||$('#nt');if(b)b.focus();say('Tarefa restaurada');return true}
 return false}
/* arrastar para reordenar (o mouse usa isto; teclado e toque usam os botões) */
let dragR=-1;const clr=()=>document.querySelectorAll('#view li.ins-a,#view li.ins-b,#view li.drag').forEach(x=>x.classList.remove('ins-a','ins-b','drag'));
$('#view').addEventListener('dragstart',e=>{const li=e.target.closest&&e.target.closest('li[data-r]');if(!li)return;dragR=+li.dataset.r;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragR));li.classList.add('drag')});
$('#view').addEventListener('dragover',e=>{const li=e.target.closest&&e.target.closest('li[data-r]');if(dragR<0||!li)return;e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('#view li.ins-a,#view li.ins-b').forEach(x=>x.classList.remove('ins-a','ins-b'));const r=li.getBoundingClientRect();li.classList.add(e.clientY>r.top+r.height/2?'ins-a':'ins-b')});
$('#view').addEventListener('drop',e=>{const li=e.target.closest&&e.target.closest('li[data-r]');if(dragR<0||!li)return;e.preventDefault();
 const r=li.getBoundingClientRect();let to=+li.dataset.r+(e.clientY>r.top+r.height/2?1:0);const from=dragR;dragR=-1;clr();
 if(from<to)to--;if(to===from)return;const[x]=S.tasks.splice(from,1);S.tasks.splice(to,0,x);save();view();say(unesc(x.t)+': posição '+(to+1)+' de '+S.tasks.length)});
$('#view').addEventListener('dragend',()=>{dragR=-1;clr()});

function parsePlaylist(tx){tx=String(tx).replace(/^\uFEFF/,'');
 if(/#EXT-X-(STREAM-INF|TARGETDURATION|MEDIA-SEQUENCE|VERSION)/.test(tx))return {hls:true,items:[]};
 const items=[],seen=new Set(),add=(u,n)=>{u=String(u||'').trim();if(!/^https?:\/\/\S+$/i.test(u)||seen.has(u))return;seen.add(u);let nome=String(n||'').replace(/[\u0000-\u001f]/g,'').trim();if(!nome){try{nome=new URL(u).hostname}catch(_){nome='Emissora'}}items.push({u,n:nome.slice(0,40)})};
 const L=tx.split(/\r?\n/);
 if(/^\s*\[playlist\]/im.test(tx)){const f={},t={};L.forEach(l=>{const m=/^\s*(File|Title)(\d+)\s*=\s*(.*)$/i.exec(l);if(m)(m[1].toLowerCase()==='file'?f:t)[m[2]]=m[3]});Object.keys(f).sort((a,b)=>a-b).forEach(k=>add(f[k],t[k]))}
 else{let nome='';L.forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){const m=/^#EXTINF:(?:[^",]|"[^"]*")*,(.*)$/i.exec(l);if(m)nome=m[1];return}add(l,nome);nome=''})}
 return {hls:false,items:items.slice(0,200)}}

 f.text().then(tx=>{const r=parsePlaylist(tx);
  if(r.hls){msg('Este arquivo é uma lista HLS (.m3u8). Cole o endereço dela no campo do link de uma emissora.');return}
  if(!r.items.length){msg('Não encontrei links http ou https nesse arquivo.');return}
  rdCollect();const have=new Set(S.rd.draft.map(x=>x.u));let add=0;
  for(const it of r.items){if(S.rd.draft.length>=200)break;if(have.has(it.u))continue;have.add(it.u);S.rd.draft.push({n:it.n,u:it.u,g:'Importadas'});add++}

 if(t.d)return {txt:'venc. '+dm,late:false};
 if(diff<0)return {txt:'atrasada há '+(-diff)+(diff===-1?' dia':' dias'),late:true};
 return {txt:diff===0?'vence hoje':diff===1?'vence amanhã':'vence '+dm,late:false}}

async function todoSync(manual){
 const Z=S.todo;if(Z.busy||!todoOn()||!msOn())return;if(!manual&&!Z.dirty&&Date.now()-Z.at<270000)return;
 Z.busy=true;Z.err='';Z.dirty=false;
 try{
  if(!await msEnsure())throw {k:'auth'};
  const bad=r=>r.status===401||r.status===403?'scope':r.status===404?'lista':'api';
  let lid=ls.get('todo_list');
  if(!lid){const r=await gj('/me/todo/lists');if(!r.ok)throw {k:bad(r)};const L=(r.j&&r.j.value)||[],d=L.find(x=>x.wellknownListName==='defaultList')||L[0];if(!d)throw {k:'lista'};lid=d.id;ls.set('todo_list',lid)}
  const base='/me/todo/lists/'+encodeURIComponent(lid)+'/tasks';let url=base+'?$top=100',rem=[];
  for(let n=0;url&&n<10;n++){const r=await gj(url);if(!r.ok){if(r.status===404)ls.del('todo_list');throw {k:bad(r)}}rem=rem.concat((r.j&&r.j.value)||[]);const nx=r.j&&r.j['@odata.nextLink'];url=nx?nx.replace('https://graph.microsoft.com/v1.0',''):''}
  // 1. exclusões feitas aqui
  let q=[];try{q=JSON.parse(ls.get('todo_del')||'[]')}catch(_){}
  const gone=new Set();for(const x of q){if(x.l&&x.l!==lid)continue;const r=await gj(base+'/'+encodeURIComponent(x.id),{method:'DELETE'});if(r.ok||r.status===404)gone.add(x.id)}
  ls.set('todo_del',JSON.stringify(q.filter(x=>!gone.has(x.id))));
  // 2. mescla
  const by=new Map(S.tasks.filter(t=>t.mid&&t.tl===lid).map(t=>[t.mid,t])),seen=new Set(rem.map(r=>r.id));
  for(const r of rem){if(gone.has(r.id))continue;const t=by.get(r.id),rdone=r.status==='completed',rdue=r.dueDateTime&&r.dueDateTime.dateTime?r.dueDateTime.dateTime.slice(0,10):undefined,rmod=Date.parse(r.lastModifiedDateTime)||0;
   if(!t){if(!rdone)S.tasks.push({id:'m'+r.id.slice(-10)+S.tasks.length,t:esc(r.title||'(sem título)'),w:hm(Date.now()),d:false,c:0,due:rdue,mid:r.id,tl:lid,mod:rmod,rv:rmod});continue}
   const mudouLa=rmod!==(t.rv||0);
   if(t.dy&&(!mudouLa||(t.mod||0)>rmod)){const p=await gj(base+'/'+encodeURIComponent(r.id),{method:'PATCH',body:JSON.stringify(toDo(t))});if(p.ok&&p.j){t.rv=Date.parse(p.j.lastModifiedDateTime)||Date.now();t.dy=false}}
   else if(mudouLa){t.t=esc(r.title||'(sem título)');t.d=rdone;t.due=rdue;t.mod=rmod;t.rv=rmod;t.dy=false}}
  // 3. apagadas no To Do somem aqui; vínculos de outra lista viram tarefas locais
  S.tasks=S.tasks.filter(t=>!(t.mid&&t.tl===lid&&!seen.has(t.mid)&&!gone.has(t.mid)));
  S.tasks.forEach(t=>{if(t.mid&&t.tl!==lid){delete t.mid;delete t.tl}});
  // 4. novas daqui vão para o To Do
  for(const t of S.tasks.filter(t=>!t.mid)){const r=await gj(base,{method:'POST',body:JSON.stringify(toDo(t))});if(r.ok&&r.j){t.mid=r.j.id;t.tl=lid;t.rv=Date.parse(r.j.lastModifiedDateTime)||Date.now();t.mod=t.rv;t.dy=false}else if(r.status===401||r.status===403)throw {k:'scope'}}
  ls.set('tasks',JSON.stringify(S.tasks));Z.at=Date.now();
  if(manual)say('Tarefas sincronizadas com o Microsoft To Do às '+hm(Z.at));
 }catch(e){Z.err=(e&&e.k)||'api';if(manual)say(Z.err==='scope'?'Falta autorizar o acesso às tarefas':'Não consegui sincronizar com o Microsoft To Do')}

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const WMO=[[[0],'Céu limpo','sun'],[[1,2],'Parcialmente nublado','cloud'],[[3],'Nublado','cloud'],[[45,48],'Nevoeiro','fog'],[[51,53,55,56,57],'Garoa','rain'],[[61,63,65,66,67,80,81,82],'Chuva','rain'],[[71,73,75,77,85,86],'Neve','snow'],[[95,96,99],'Tempestade','storm']];
const wmo=c=>{const r=WMO.find(x=>x[0].includes(c));return r?{t:r[1],i:r[2]}:{t:'Tempo variável',i:'cloud'}};
const WXI={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 cloud:'<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z"/>',
 rain:'<path d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 14z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
 snow:'<path d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 14z"/><path d="M8 18h.01M12 19h.01M16 18h.01"/>',
 storm:'<path d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 14z"/><path d="M12 14l-2 4h3l-2 4"/>',
 fog:'<path d="M3 8h18M5 12h14M3 16h18"/>'};
const wIcon=n=>'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+WXI[n]+'</svg>';
function wxHtml(){const w=WX.data;
 if(!w)return WX.busy?'<span class="sub">Carregando o clima…</span>':'<span class="sub">Clima indisponível agora. Confira a conexão com a internet.</span>';
 const c=w.current,d=w.daily,cur=wmo(c.weather_code),tmax=Math.round(d.temperature_2m_max[0]),tmin=Math.round(d.temperature_2m_min[0]);
 const dias=[1,2,3].map(k=>{const x=wmo(d.weather_code[k]);return '<span class="fd"><span class="sub">'+cap(fWd.format(new Date(d.time[k]+'T12:00:00-03:00'))).replace('.','')+'</span>'+wIcon(x.i)+'<span>'+Math.round(d.temperature_2m_max[k])+'° / '+Math.round(d.temperature_2m_min[k])+'°</span><span class="sr">'+x.t+'</span></span>'}).join('');
 return '<div class="wnow"><span class="wicon">'+wIcon(cur.i)+'</span><span class="wt" aria-hidden="true">'+Math.round(c.temperature_2m)+'°</span><span class="sr">Agora em '+esc(WX.loc.n)+': '+Math.round(c.temperature_2m)+' graus, '+cur.t+'</span>'+
  '<span class="wd"><span class="wcity">'+esc(WX.loc.n)+'</span><span class="sub">'+cur.t+'. Mín. '+tmin+'°, máx. '+tmax+'°</span></span></div><div class="wdays">'+dias+'</div>'}
function paintWx(){const e=$('#hwx');if(e)e.innerHTML=wxHtml();const w=$('#wcur');if(w)w.textContent=WX.loc.n}
async function wxLoad(manual){if(WX.busy)return;WX.busy=true;
 try{const r=await fetch('https://api.open-meteo.com/v1/forecast?'+new URLSearchParams({latitude:WX.loc.lat,longitude:WX.loc.lon,current:'temperature_2m,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min',timezone:TZ,forecast_days:'4'}));
  if(!r.ok)throw 0;const j=await r.json();if(!j.current||!j.daily)throw 0;WX.data=j;WX.at=Date.now()}
 catch(_){if(manual)say('Não foi possível atualizar o clima')}
 WX.busy=false;paintWx()}
let lastMin=-1;
function paintClock(){const now=new Date(),el=$('#hclk');
 if(el){const t=fClock.format(now);if(el.textContent!==t)el.textContent=t}
 const mm=+now.toLocaleString('en-US',{timeZone:TZ,minute:'numeric'});
 if(mm!==lastMin){lastMin=mm;const d=cap(fDate.format(now)),hm2=now.toLocaleTimeString('pt-BR',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).replace(':',' horas e ')+' minutos';
  const dt=$('#hdate');if(dt)dt.textContent=d;const sr=$('#hsr');if(sr)sr.textContent='Horário de São Paulo: '+d+', '+hm2}}
async function wxFind(q){const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?'+new URLSearchParams({name:q,count:'1',language:'pt',format:'json'}));if(!r.ok)throw 0;const j=await r.json();return (j.results||[])[0]||null}
async function wxSet(q){const m=$('#wmsg');m.textContent='Buscando…';
 try{const g=await wxFind(q);if(!g){m.textContent='Cidade não encontrada. Tente outro nome.';return}
  WX.loc={n:[g.name,g.admin1].filter(Boolean).join(', ').slice(0,60),lat:g.latitude,lon:g.longitude};ls.set('wx_loc',JSON.stringify(WX.loc));WX.data=null;
  paintWx();await wxLoad();m.textContent='Clima de '+WX.loc.n;say('Clima de '+WX.loc.n)}
 catch(_){m.textContent='Não foi possível buscar a cidade agora.'}}
$('#view').addEventListener('submit',e=>{if(e.target.id!=='wform')return;e.preventDefault();const q=$('#wcity').value.trim();
 if(q.length<2){$('#wmsg').textContent='Digite pelo menos 2 letras.';return}wxSet(q)});
$('#view').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a=wdef]');if(!b)return;
 WX.loc=WX_DEF;ls.set('wx_loc',JSON.stringify(WX_DEF));WX.data=null;paintWx();$('#wmsg').textContent='Clima de '+WX_DEF.n;wxLoad();say('Clima de '+WX_DEF.n)});
/* Dumont FM: incluída nas listas já salvas (migração única) */
if(!ls.get('radios_v5')){const L=S.rd.list;if(!L.some(x=>nrm(x.n)===nrm('Dumont FM 104.3')))L.push({n:'Dumont FM 104.3',u:'',g:'Brasil'});ls.set('radios',JSON.stringify(L));ls.set('radios_v5','1')}

/* Hunter.FM e Dumont FM: links informados pelo usuário. Preenche as entradas já salvas e acrescenta as que faltam (migração única) */
const RD_V6=[
 {n:"Hunter.FM Sertanejo",u:"https://live.hunter.fm/sertanejo_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM pop",u:"https://live.hunter.fm/pop_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Pagode",u:"https://live.hunter.fm/pagode_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Rock",u:"https://live.hunter.fm/rock_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Moda Sertaneja",u:"https://live.hunter.fm/modasertaneja_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Hunter Gospel",u:"https://live.hunter.fm/gospel_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Hits Brasil",u:"https://live.hunter.fm/hitsbrasil_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM MPB",u:"https://live.hunter.fm/mpb_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Pop2K",u:"https://live.hunter.fm/pop2k_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Canal 80",u:"https://live.hunter.fm/80s_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Master",u:"https://live.hunter.fm/master_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Pisadinha",u:"https://live.hunter.fm/pisadinha_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM Tropical",u:"https://live.hunter.fm/tropical_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Hunter.FM lo-Fi",u:"https://live.hunter.fm/lofi_stream?ag=mp3",g:"Brasil · estilos e regionais"},
 {n:"Rádio Dumont FM 104.3",u:"https://8402.brasilstream.com.br/stream",g:"Brasil · estilos e regionais",alt:"Dumont FM 104.3"}];
if(!ls.get('radios_v6')){const L=S.rd.list;RD_V6.forEach(d=>{const k=L.findIndex(x=>nrm(x.n)===nrm(d.n)||(d.alt&&nrm(x.n)===nrm(d.alt)));if(k>=0){if(!L[k].u)L[k].u=d.u;L[k].n=d.n;L[k].g=d.g}else L.push({n:d.n,u:d.u,g:d.g})});ls.set('radios',JSON.stringify(L));ls.set('radios_v6','1')}
paintClock();paintWx();wxLoad();
setInterval(paintClock,1000);
setInterval(()=>{if(Date.now()-WX.at>30*60000)wxLoad()},60000);

</script>
